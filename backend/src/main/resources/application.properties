spring.application.name=pennywise

# Load local secrets when started from either the repository root or backend/.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/pennywise
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Database initialization
spring.sql.init.mode=never
